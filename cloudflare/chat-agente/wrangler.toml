# Worker del agente de IA del chat. Atiende /api/chat en el dominio principal.
#
# La llave del proveedor NO va acá. Se carga una sola vez como secreto:
#   npx wrangler secret put IA_API_KEY --name chat-agente
# o desde el panel de Cloudflare, en Workers → chat-agente → Settings → Variables.
name = "chat-agente"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Ruta más específica que la del sitio, así que Cloudflare la atiende primero.
routes = [
  { pattern = "hacksincodigos.com/api/chat", zone_name = "hacksincodigos.com" },
  { pattern = "hacksincodigos.com/api/lead", zone_name = "hacksincodigos.com" },
]

# Donde caen los contactos que la gente deja en el chat. Se leen con
# `node scripts/leads.mjs`. Se borran solos a los 180 días.
[[kv_namespaces]]
binding = "LEADS"
id = "093cfd6921ea49a282b68ee2e940b992"

[vars]
ORIGENES = "https://hacksincodigos.com"
# OpenModel (api.openmodel.ai), protocolo Messages. La llave empieza con "om-".
# Modelos baratos que hablan este mismo protocolo, si se quiere abaratar más:
#   deepseek-v4.1-flash  ·  glm-5.3-flash  ·  qwen3.8-flash
IA_BASE_URL = "https://api.openmodel.ai"
IA_MODELO = "claude-haiku-4-5-20251001"
